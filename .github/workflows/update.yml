name: Atualizar dados do RA

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar dados
        run: node fetch-ra.mjs
        env:
          RA_USER: Jayvee
          RA_API_KEY: ${{ secrets.RA_API_KEY }}
      - name: Salvar mudanças
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/status.json
          git diff --staged --quiet || (git commit -m "Atualiza dados do RA" && git push)
